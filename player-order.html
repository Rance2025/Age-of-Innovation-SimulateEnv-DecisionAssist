<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>玩家排序 - Age of Innovation</title>
  <style>
    :root {
      --bg-primary: #0f0f1a;
      --bg-secondary: #1a1a2e;
      --bg-card: #252540;
      --accent: #6366f1;
      --accent-glow: #818cf8;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --border: #334155;
      --success: #22c55e;
      --drag-highlight: rgba(99, 102, 241, 0.3);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 480px;
    }

    .header {
      text-align: center;
      margin-bottom: 32px;
    }

    .header h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
      background: linear-gradient(135deg, var(--accent-glow), #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header p {
      color: var(--text-secondary);
      font-size: 14px;
    }

    .player-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }

    .player-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 16px;
      cursor: grab;
      transition: all 0.2s ease;
      user-select: none;
    }

    .player-card:hover {
      border-color: var(--accent);
      box-shadow: 0 0 20px var(--drag-highlight);
    }

    .player-card.dragging {
      opacity: 0.5;
      transform: scale(1.02);
      cursor: grabbing;
    }

    .player-card.drag-over {
      border-color: var(--success);
      background: rgba(34, 197, 94, 0.1);
    }

    .order-badge {
      width: 36px;
      height: 36px;
      background: var(--accent);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 16px;
      flex-shrink: 0;
    }

    .player-avatar {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      flex-shrink: 0;
    }

    .player-info {
      flex: 1;
      min-width: 0;
    }

    .player-name {
      font-weight: 600;
      font-size: 16px;
      margin-bottom: 4px;
    }

    .player-color {
      font-size: 12px;
      color: var(--text-secondary);
      text-transform: capitalize;
    }

    .drag-handle {
      color: var(--text-secondary);
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 8px;
      cursor: grab;
    }

    .drag-handle span {
      display: block;
      width: 18px;
      height: 2px;
      background: currentColor;
      border-radius: 1px;
    }

    .drag-handle:hover {
      color: var(--accent);
    }

    .btn-group {
      display: flex;
      gap: 12px;
    }

    .btn {
      flex: 1;
      padding: 14px 24px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-secondary {
      background: var(--bg-card);
      color: var(--text-primary);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      border-color: var(--accent);
      background: var(--bg-secondary);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #8b5cf6);
      color: white;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .instructions {
      text-align: center;
      color: var(--text-secondary);
      font-size: 13px;
      margin-top: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .instructions svg {
      width: 16px;
      height: 16px;
    }

    /* Animation for position changes */
    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(-10px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .player-card {
      animation: slideIn 0.3s ease forwards;
    }

    .player-card:nth-child(1) { animation-delay: 0ms; }
    .player-card:nth-child(2) { animation-delay: 50ms; }
    .player-card:nth-child(3) { animation-delay: 100ms; }
    .player-card:nth-child(4) { animation-delay: 150ms; }
    .player-card:nth-child(5) { animation-delay: 200ms; }
    .player-card:nth-child(6) { animation-delay: 250ms; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>设置玩家顺序</h1>
      <p>拖动卡片调整回合顺序</p>
    </div>

    <div class="player-list" id="playerList">
      <!-- Player cards will be inserted here -->
    </div>

    <div class="btn-group">
      <button class="btn btn-secondary" onclick="randomizeOrder()">随机排列</button>
      <button class="btn btn-primary" onclick="confirmOrder()">确认顺序</button>
    </div>

    <div class="instructions">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <line x1="12" y1="18" x2="12" y2="12"/>
        <line x1="9" y1="15" x2="15" y2="15"/>
      </svg>
      按住并拖动卡片即可重新排序
    </div>
  </div>

  <script>
    // Player data
    const players = [
      { id: 1, name: '红方', color: '#ef4444', emoji: '🔴' },
      { id: 2, name: '蓝方', color: '#3b82f6', emoji: '🔵' },
      { id: 3, name: '绿方', color: '#22c55e', emoji: '🟢' },
      { id: 4, name: '黄方', color: '#eab308', emoji: '🟡' }
    ];

    let draggedItem = null;

    function renderPlayers() {
      const list = document.getElementById('playerList');
      list.innerHTML = players.map((player, index) => `
        <div class="player-card" draggable="true" data-id="${player.id}">
          <div class="order-badge">${index + 1}</div>
          <div class="player-avatar" style="background: ${player.color}20; color: ${player.color}">
            ${player.emoji}
          </div>
          <div class="player-info">
            <div class="player-name">${player.name}</div>
            <div class="player-color">第 ${index + 1} 位行动</div>
          </div>
          <div class="drag-handle">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
      `).join('');

      // Add drag event listeners
      document.querySelectorAll('.player-card').forEach(card => {
        card.addEventListener('dragstart', handleDragStart);
        card.addEventListener('dragend', handleDragEnd);
        card.addEventListener('dragover', handleDragOver);
        card.addEventListener('drop', handleDrop);
        card.addEventListener('dragenter', handleDragEnter);
        card.addEventListener('dragleave', handleDragLeave);
      });
    }

    function handleDragStart(e) {
      draggedItem = this;
      this.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/html', this.innerHTML);
    }

    function handleDragEnd(e) {
      this.classList.remove('dragging');
      document.querySelectorAll('.player-card').forEach(card => {
        card.classList.remove('drag-over');
      });
      draggedItem = null;
    }

    function handleDragOver(e) {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      return false;
    }

    function handleDragEnter(e) {
      if (this !== draggedItem) {
        this.classList.add('drag-over');
      }
    }

    function handleDragLeave(e) {
      this.classList.remove('drag-over');
    }

    function handleDrop(e) {
      e.stopPropagation();
      e.preventDefault();

      if (draggedItem !== this) {
        // Get indices
        const fromIndex = players.findIndex(p => p.id === parseInt(draggedItem.dataset.id));
        const toIndex = players.findIndex(p => p.id === parseInt(this.dataset.id));

        // Reorder array
        const [moved] = players.splice(fromIndex, 1);
        players.splice(toIndex, 0, moved);

        // Re-render
        renderPlayers();
      }

      return false;
    }

    function randomizeOrder() {
      // Fisher-Yates shuffle
      for (let i = players.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [players[i], players[j]] = [players[j], players[i]];
      }
      renderPlayers();
    }

    function confirmOrder() {
      const order = players.map((p, i) => `${i + 1}. ${p.name}`).join('\n');
      alert(`玩家顺序已确认：\n\n${order}`);
      console.log('Confirmed order:', players);
    }

    // Initial render
    renderPlayers();
  </script>
</body>
</html>
